[project]
name = "film-junky-union-mvp"
version = "0.1.0"
description = "Sistema inteligente de filtrado y categorización de reseñas cinematográficas para Film Junky Union"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "scikit-learn>=1.4.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "tqdm>=4.66.0",
    "nltk>=3.8.1",
    "joblib>=1.3.0",
    "ipykernel>=6.29.0",
    "streamlit>=1.35.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
